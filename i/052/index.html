    const a = icon.about;
    const aboutRows = [
      [t.where, a.location ? pick(a.location, L) : (showGaps ? t.gapWhere : null)],
      [t.depiction, pick(a.depiction, L)],
      [t.inscription, a.inscription],
      [t.relic, pick(a.relic, L)],
      [t.painter, a.iconographer || (showGaps ? t.gapPainter : null)],
      [L === 'ru' ? 'Размер' : 'Größe', a.size ? a.size + (L === 'ru' ? ' см' : ' cm') : null],
      [t.number, icon.id]
    ].filter(r => r[1]);

    const blocks = [];
    if (prayerShown) blocks.push(['prayer', t.prayer, `<p class="prayer-text" lang="${prayerLang}">${withInitial(prayerShown.text)}</p>`]);
    if (hasHymns) blocks.push(['hymns', t.hymns, `${tropText ? `<p class="hymn-rubric">${esc(icon.troparion.tone ? t.trop(icon.troparion.tone) : t.trop('').replace(/,.*$/, ''))}</p><p class="hymn" lang="${L}">${paras(tropText)}</p>` : ''}
            ${kontText ? `<p class="hymn-rubric">${esc(icon.kontakion.tone ? t.kont(icon.kontakion.tone) : t.kont('').replace(/,.*$/, ''))}</p><p class="hymn" lang="${L}">${paras(kontText)}</p>` : ''}`]);
    if (lifeShown) blocks.push(['life', t.life, `${!life && L !== 'ru' ? `<p class="note">${esc(t.noLifeDe)}</p>` : ''}
            <p class="life" lang="${life ? L : 'ru'}">${paras(lifeShown)}</p>`]);
    const lead = blocks.length ? `<section class="prayer" aria-labelledby="rubric"><h2 class="rubric" id="rubric">${esc(blocks[0][1])}</h2>${blocks[0][2]}</section>` : '';
    const rest = blocks.slice(1).map(([k, h, b]) => `<details data-k="${k}"${openK.has(k) ? ' open' : ''}><summary>${esc(h)}</summary><div class="body">${b}</div></details>`).join('');

    page.innerHTML = `
      ${I ? `<figure class="icon"><div class="fig" style="--r:${(I.w / I.h).toFixed(4)}"><picture><source type="image/avif" srcset="${I.base}-480.avif 480w, ${I.base}-800.avif 800w, ${I.base}-1200.avif 1200w" sizes="${I.sizes}"><img src="${I.base}-800.webp" srcset="${I.base}-480.webp 480w, ${I.base}-800.webp 800w, ${I.base}-1200.webp 1200w" sizes="${I.sizes}" alt="${esc(pick(I.alt, L) || I.alt.ru)}" width="${I.w}" height="${I.h}" decoding="async" fetchpriority="high"></picture>${hotspots(L)}</div>${icon.hotspots ? `<figcaption class="hs-hint">${esc(icon.hotspots.hint[L] || icon.hotspots.hint.ru)}</figcaption>` : ''}</figure>` : ''}
      <header class="title">
        <h1${pick(icon.name, L) ? '' : ' lang="ru"'}>${esc(name)}</h1>
        ${feast ? `<p class="feast">${esc(feast)}</p>` : ''}
      </header>
      <p class="reading-head">${esc(short)}</p>

      ${lead}

      <section class="more">
        ${rest}
        ${(icon.related || []).length ? `<div class="rel-wrap"><p class="rel-h">${L === 'ru' ? icon.relTitle.ru : icon.relTitle.de}</p><ul class="rel">${icon.related.map(r => `<li><a href="../${r.id}/index.html?lang=${L}"${r.de && L === 'de' ? '' : ' lang="ru"'}>${esc(L === 'de' && r.de ? r.de : r.ru)}</a></li>`).join('')}</ul></div>` : ''}
        ${icon.catalogue ? `<p class="cat"${icon.catalogue[L] ? '' : ' lang="ru"'}>${esc(icon.catalogue[L] || icon.catalogue.ru)}</p>` : ''}
        ${(() => { const N = icon.nav || {}, nx = N.next, pv = N.prev, de = L === 'de';
          const nm = o => esc(de && o.de ? o.de : o.ru), ln = o => de && o.de ? '' : ' lang="ru"';
          const chev = d => `<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="${d < 0 ? 'M12.5 4.5 7 10l5.5 5.5' : 'M7.5 4.5 13 10l-5.5 5.5'}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
          return `<nav class="nb" aria-label="${de ? 'Weiter' : 'Дальше'}">` + (nx ? `<p class="nb-lab">${de ? 'Weiter' : 'Дальше'}</p><a class="nb-card" href="../${nx.id}/index.html?lang=${L}">` +
            `<span class="nb-th" style="--r:${nx.r}"><picture><source type="image/avif" srcset="${nx.img}.avif" ><img src="${nx.img}.webp" alt="" loading="lazy" decoding="async"></picture></span>` +
            `<span class="nb-nm"${ln(nx)}>${nm(nx)}${nx.sec ? `<span class="nb-sec"${de && nx.sec.de ? '' : ' lang="ru"'}>${esc(de && nx.sec.de ? nx.sec.de : nx.sec.ru)}</span>` : ''}</span><span class="nb-arr">${chev(1)}</span></a>` : '') +
            `<div class="nb-row">${pv ? `<a href="../${pv.id}/index.html?lang=${L}" aria-label="${de ? 'Vorherige' : 'Предыдущая'}: ${nm(pv)}">${chev(-1)}<span>${de ? 'Vorherige' : 'Предыдущая'}</span></a>` : '<span></span>'}` +
            `<a href="../../icons/index.html?lang=${L}">${de ? 'Alle Ikonen' : 'Все иконы'}</a></div></nav>`; })()}
        <a class="back" hidden href="../../icons/index.html?lang=${L}">${esc(t.all)}</a>
        <footer class="foot">  <a class="foot-mark" href="https://www.hamburg-hram.de/" aria-label="hamburg-hram.de"><img src="../../assets/brand/church-logo-ondark.svg" alt="" width="28" height="50" loading="lazy" decoding="async"></a>  <div class="foot-txt" lang="ru">    <p class="foot-name">Храм святого праведного Иоанна Кронштадтского</p>    <p class="foot-sub">Православная церковь в Гамбурге</p>    <address>Tschaikowskyplatz 1, 20355 Hamburg<br><a href="https://www.hamburg-hram.de/">hamburg-hram.de</a></address>  </div>  <p class="foot-legal" lang="de"><a href="https://www.hamburg-hram.de/impressum">Impressum</a><a href="https://www.hamburg-hram.de/datenschutzerklaerung">Datenschutz</a></p></footer>
      </section>`;
    renderMenu();
  }

  // ---------- menu C ----------
  const $ = id => document.getElementById(id);
  function renderMenu() {
    const t = T[state.lang];
    document.querySelectorAll('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
    $('panel').setAttribute('aria-label', t.nav);
    $('panel').hidden = !state.panel;
    $('fab').textContent = state.panel ? '×' : 'Aa';
    $('fab').setAttribute('aria-expanded', String(state.panel));
    $('fab').setAttribute('aria-label', state.panel ? t.close : t.nav);
    const dots = (n, i) => Array.from({ length: n }, (_, k) => `<i${k === i ? ' class="on"' : ''}></i>`).join('');
    $('sizeValue').innerHTML = `${esc(t.sizes[state.sz])}<span class="dots" aria-hidden="true">${dots(3, state.sz)}</span>`;
    $('weightValue').innerHTML = `${esc(t.weights[+state.bold])}<span class="dots" aria-hidden="true">${dots(2, +state.bold)}</span>`;
    $('langValue').textContent = t.other;                    // shows the language you will switch TO
    $('readValue').textContent = state.reading ? t.readOff : t.readOn;  // shows what tapping will do
  }

  function syncUrl() {
    const p = new URLSearchParams(location.search);
    p.set('lang', state.lang);
    state.reading ? p.set('read', '1') : p.delete('read');
    history.replaceState(null, '', '?' + p.toString());
  }

  $('fab').addEventListener('click', () => { state.panel = !state.panel; renderMenu(); });
  $('size').addEventListener('click', () => { state.sz = (state.sz + 1) % SIZES.length; store.set('sz', state.sz); applySettings(); renderMenu(); });
  $('weight').addEventListener('click', () => { state.bold = !state.bold; store.set('bold', state.bold ? '1' : '0'); applySettings(); renderMenu(); });
  $('lang').addEventListener('click', () => { state.lang = state.lang === 'ru' ? 'de' : 'ru'; store.set('lang', state.lang); syncUrl(); render(); $('lang').focus(); });
  $('read').addEventListener('click', () => { state.reading = !state.reading; syncUrl(); render(); window.scrollTo({ top: 0 }); $('read').focus(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.panel) { state.panel = false; renderMenu(); $('fab').focus(); } });
  document.addEventListener('click', e => { if (state.panel && !$('menu').contains(e.target)) { state.panel = false; renderMenu(); } });

  render();
})();
</script>
</body>
</html>
